<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Stark Future | 3D Parts Identifier</title>
  <meta name="theme-color" content="#080809">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/branding/Stark%20Future%20Ring%20RGB.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'stark-green':'#00ff41','stark-red':'#ff0033','stark-gold':'#C9A84C'}}}}</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/environments/RoomEnvironment.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    @font-face { font-family:'StarkSans'; src:url('https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/fonts/2_StarkSans-Regular.otf') format('opentype'); font-weight:400; font-display:swap; }
    @font-face { font-family:'StarkSans'; src:url('https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/fonts/3_StarkSans-Medium.otf') format('opentype'); font-weight:500; font-display:swap; }
    @font-face { font-family:'StarkSans'; src:url('https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/fonts/5_StarkSans-Bold.otf') format('opentype'); font-weight:700; font-display:swap; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#080809; --card:#0e0e10; --border:#1a1a1f;
      --gold:#C9A84C; --gold-bright:#FFD700; --green:#00ff41; --red:#ff0033;
      --text:#eeeeee; --muted:#6b7280;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    html, body { background:var(--bg); color:var(--text); font-family:'StarkSans','Inter',system-ui,sans-serif; height:100%; overflow:hidden; -webkit-text-size-adjust:100%; }
    body { padding-top:var(--safe-top); }
    #canvas-wrap { position:relative; width:100vw; height:100vh; }
    canvas { display:block; width:100%!important; height:100%!important; touch-action:none; }

    /* ── Animations ── */
    @keyframes slideInRight  { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:translateX(0)} }
    @keyframes slideInBottom { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    @keyframes shimmer  { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
    @keyframes spin     { to{transform:rotate(360deg)} }
    @keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0)} 50%{box-shadow:0 0 0 6px rgba(201,168,76,.12)} }
    .shimmer { background:linear-gradient(90deg,#1a1a1a 25%,#262626 50%,#1a1a1a 75%); background-size:400px 100%; animation:shimmer 1.4s infinite; }

    /* ── Loader ── */
    #loader { position:fixed; inset:0; background:#080809; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; transition:opacity .6s; }
    #loader.fade-out { opacity:0; pointer-events:none; }
    #loader-bar-track { width:min(280px,70vw); height:2px; background:#1a1a1a; border-radius:9px; margin-top:24px; }
    #loader-bar { height:100%; background:linear-gradient(90deg,#C9A84C,#FFD700); border-radius:9px; transition:width .2s; width:0%; box-shadow:0 0 12px #C9A84C88; }

    /* ── Header ── */
    #header { position:fixed; top:0; left:0; right:0; z-index:20; padding:max(12px, calc(var(--safe-top) + 10px)) 16px 12px; display:flex; align-items:center; gap:10px; pointer-events:none; }
    .header-badge { background:rgba(8,8,9,.88); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 13px; }

    /* ── Help pill ── */
    #help-pill { position:fixed; bottom:calc(28px + var(--safe-bottom)); left:50%; transform:translateX(-50%); z-index:20;
      background:rgba(8,8,9,.82); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.06); border-radius:99px; padding:9px 20px;
      font-size:12px; color:var(--muted); white-space:nowrap;
      pointer-events:none; transition:opacity .5s; }
    #help-pill.hidden { opacity:0; }

    /* ── Part panel — shared ── */
    .part-panel { position:fixed; z-index:30; }
    .part-panel-inner {
      background:rgba(8,8,9,.97);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,.065);
      box-shadow:0 24px 64px rgba(0,0,0,.85);
      overflow:hidden;
    }

    /* ── MOBILE: bottom sheet (<540px) ── */
    @media (max-width:539px) {
      .part-panel { bottom:0; left:0; right:0; animation:slideInBottom .24s cubic-bezier(.4,0,.2,1); }
      .part-panel-inner { border-radius:22px 22px 0 0; border-bottom:none; max-height:72vh; display:flex; flex-direction:column; }
      .panel-scroll { overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
      .panel-scroll::-webkit-scrollbar { display:none; }
      .panel-handle { width:36px; height:4px; background:#2a2a2e; border-radius:99px; margin:10px auto 4px; flex-shrink:0; }
      .part-panel .panel-pad { padding:14px 20px 16px; }
      .panel-part-no { font-size:clamp(22px,6vw,32px) !important; }
      .panel-search-results { max-height:38vh; }
      .panel-btn { min-height:44px; }
      .safe-bottom-pad { height:calc(16px + var(--safe-bottom)); flex-shrink:0; }
    }

    /* ── TABLET: side panel (540px–1023px) ── */
    @media (min-width:540px) and (max-width:1023px) {
      .part-panel { bottom:20px; right:16px; animation:slideInRight .22s cubic-bezier(.4,0,.2,1); }
      .part-panel-inner { border-radius:20px; width:320px; }
      .part-panel .panel-pad { padding:18px 20px; }
      .panel-part-no { font-size:28px !important; }
      .panel-search-results { max-height:240px; }
      .panel-btn { min-height:40px; }
      .panel-handle, .safe-bottom-pad { display:none; }
    }

    /* ── DESKTOP: side panel (1024px+) ── */
    @media (min-width:1024px) {
      .part-panel { bottom:24px; right:24px; animation:slideInRight .22s cubic-bezier(.4,0,.2,1); }
      .part-panel-inner { border-radius:20px; width:300px; }
      .part-panel .panel-pad { padding:18px 20px; }
      .panel-part-no { font-size:30px !important; }
      .panel-search-results { max-height:200px; }
      .panel-btn { min-height:38px; }
      .panel-handle, .safe-bottom-pad { display:none; }
    }

    /* ── Search results scroll ── */
    .panel-search-results { overflow-y:auto; scrollbar-width:thin; scrollbar-color:#222 transparent; }
    .panel-search-results::-webkit-scrollbar { width:4px; }
    .panel-search-results::-webkit-scrollbar-track { background:transparent; }
    .panel-search-results::-webkit-scrollbar-thumb { background:#222; border-radius:9px; }

    /* ── Touch-friendly close btn ── */
    .close-btn { display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.05); border:none; color:#6b7280; cursor:pointer; transition:all .15s; flex-shrink:0; -webkit-tap-highlight-color:transparent; }
    .close-btn:hover, .close-btn:active { background:rgba(255,255,255,.1); color:#fff; }

    /* ── Tag row btn ── */
    .tag-row-btn { width:100%; text-align:left; padding:11px 20px; background:none; border:none; cursor:pointer; transition:background .15s; -webkit-tap-highlight-color:transparent; }
    .tag-row-btn:hover, .tag-row-btn:active { background:rgba(255,255,255,.04); }

    /* ── Action button ── */
    .action-btn { display:flex; align-items:center; justify-content:center; gap:6px; font-size:11px; font-family:monospace; border-radius:12px; padding:0 16px; cursor:pointer; transition:all .2s; text-decoration:none; width:100%; -webkit-tap-highlight-color:transparent; }
    .action-btn-primary { color:#C9A84C; background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.3); }
    .action-btn-primary:hover, .action-btn-primary:active { color:#FFD700; background:rgba(201,168,76,.2); }
    .action-btn-secondary { color:#6b7280; background:#111113; border:1px solid #1e1e22; }
    .action-btn-secondary:hover, .action-btn-secondary:active { color:#aaa; background:#1a1a1e; }

    /* ── Search input wrap ── */
    .search-wrap { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.04); border:1px solid #1e1e22; border-radius:14px; padding:11px 14px; transition:border-color .2s; }
    .search-wrap:focus-within { border-color:rgba(201,168,76,.5); }
    .search-input { background:none; border:none; outline:none; color:#eee; font-size:14px; width:100%; font-family:monospace; }

    /* ── Stock ring label ── */
    .stock-label { font-size:9px; font-family:monospace; text-transform:uppercase; letter-spacing:.1em; }

    /* ── Chip pill ── */
    .chip { font-size:9px; font-family:monospace; text-transform:uppercase; letter-spacing:.08em; color:#9ca3af; background:#111113; border:1px solid #1e1e22; border-radius:99px; padding:4px 12px; }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <img src="https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/branding/Stark%20Future%20Ring%20RGB.png"
       width="52" height="52" alt="Stark" style="filter:drop-shadow(0 0 20px #C9A84C66)">
  <p style="margin-top:20px;font-size:13px;color:#6b7280;font-family:monospace;letter-spacing:.12em">CARGANDO MODELO 3D</p>
  <div id="loader-bar-track"><div id="loader-bar"></div></div>
  <p id="loader-pct" style="margin-top:10px;font-size:11px;color:#444;font-family:monospace">0%</p>
</div>

<!-- HEADER -->
<div id="header">
  <div class="header-badge" style="display:flex;align-items:center;gap:9px">
    <img src="https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/branding/Stark%20Future%20Ring%20RGB.png"
         width="20" height="20" alt="Stark">
    <span style="font-size:12px;font-weight:500;color:#eee;letter-spacing:.04em;white-space:nowrap">3D Parts Identifier</span>
  </div>
  <div class="header-badge" id="tagged-counter" style="display:none">
    <span style="font-size:11px;font-family:monospace;color:#C9A84C">
      <span id="tagged-num">0</span> <span id="tagged-label">catalogadas</span>
    </span>
  </div>
</div>

<!-- CANVAS -->
<div id="canvas-wrap">
  <canvas id="three-canvas"></canvas>
</div>

<!-- HELP PILL -->
<div id="help-pill">Toca cualquier parte para identificarla</div>

<!-- PART PANEL -->
<div id="part-panel-root"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const GLB_URL       = 'https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/moto_web.glb';
const DRACO_PATH    = 'https://www.gstatic.com/draco/versioned/decoders/1.5.6/';
const PARTS_MAP_URL = 'https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/claude/moto-parts-cad-identification-372jL/parts-mesh-map.json';
const BC_BASE_URL   = 'https://businesscentral.dynamics.com';

const isMobile = () => window.innerWidth < 540;

// ═══════════════════════════════════════════════════════════════
//  PARTS MAP CACHE
// ═══════════════════════════════════════════════════════════════
let _partsMap = null;
async function getPartsMap() {
  if (_partsMap) return _partsMap;
  try {
    const r = await fetch(PARTS_MAP_URL + '?t=' + Math.floor(Date.now()/300000));
    _partsMap = await r.json();
  } catch { _partsMap = {}; }
  return _partsMap;
}

// ═══════════════════════════════════════════════════════════════
//  GAS BRIDGE
// ═══════════════════════════════════════════════════════════════
function callGAS(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google?.script?.run) { reject(new Error('No GAS context')); return; }
    window.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

// ═══════════════════════════════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════════════════════════════
const canvas   = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile(), alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile() ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080809);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 1000);
camera.position.set(0, 0.8, 2.8);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.4;
controls.maxDistance = 10;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

const pmremGen = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGen.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

const composer  = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  isMobile() ? 0.25 : 0.35, 0.6, 0.82
);
composer.addPass(bloomPass);

// ═══════════════════════════════════════════════════════════════
//  MESH STATE
// ═══════════════════════════════════════════════════════════════
let allMeshes = [], hoveredMesh = null, selectedMesh = null;
const origEmissive = new Map();
const HOVER_COLOR  = new THREE.Color(0xFFCC44);
const SELECT_COLOR = new THREE.Color(0xFFD700);

function setEmissive(mesh, color, intensity) {
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  mats.forEach(m => { if (m.emissive) { m.emissive.copy(color); m.emissiveIntensity = intensity; } });
}
function resetEmissive(mesh) {
  const orig = origEmissive.get(mesh);
  if (!orig) return;
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  mats.forEach(m => { if (m.emissive) { m.emissive.copy(orig.color); m.emissiveIntensity = orig.intensity; } });
}
function storeOrigEmissive(mesh) {
  if (origEmissive.has(mesh)) return;
  const m = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
  origEmissive.set(mesh, { color: m?.emissive ? m.emissive.clone() : new THREE.Color(0), intensity: m?.emissiveIntensity ?? 0 });
}

// ═══════════════════════════════════════════════════════════════
//  LOAD GLB
// ═══════════════════════════════════════════════════════════════
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath(DRACO_PATH);
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

const loaderBar = document.getElementById('loader-bar');
const loaderPct = document.getElementById('loader-pct');
const loaderEl  = document.getElementById('loader');

gltfLoader.load(GLB_URL,
  (gltf) => {
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    gltf.scene.position.sub(center);
    const size = box.getSize(new THREE.Vector3()).length();
    camera.position.set(0, size*0.25, size*(isMobile()?1.1:0.9));
    controls.target.set(0, 0, 0);
    controls.update();
    gltf.scene.traverse(child => {
      if (!child.isMesh) return;
      storeOrigEmissive(child);
      allMeshes.push(child);
    });
    scene.add(gltf.scene);
    loaderEl.classList.add('fade-out');
    setTimeout(() => { loaderEl.style.display='none'; }, 600);
    updateTaggedCounter();
    setTimeout(() => document.getElementById('help-pill').classList.add('hidden'), 4000);
  },
  (xhr) => {
    const pct = xhr.total ? Math.round((xhr.loaded/xhr.total)*100) : 0;
    loaderBar.style.width = pct + '%';
    loaderPct.textContent = pct + '%';
  },
  (err) => { loaderPct.textContent = 'Error al cargar modelo'; console.error(err); }
);

// ═══════════════════════════════════════════════════════════════
//  TAGGED COUNTER
// ═══════════════════════════════════════════════════════════════
async function updateTaggedCounter() {
  const map = await getPartsMap();
  const count = Object.values(map).filter(v => v.bcItemNo).length;
  const el = document.getElementById('tagged-counter');
  if (count > 0) {
    el.style.display = '';
    document.getElementById('tagged-num').textContent = count;
    document.getElementById('tagged-label').textContent = window.innerWidth < 360 ? '' : 'catalogadas';
  }
}

// ═══════════════════════════════════════════════════════════════
//  RAYCASTER
// ═══════════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let isDragging = false, pointerDownPos = {x:0, y:0};

function getHits(clientX, clientY) {
  mouse.x = (clientX/window.innerWidth)*2-1;
  mouse.y = -(clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(allMeshes, false).filter(h => {
    if (!h.face) return true;
    const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    return n.dot(h.point.clone().sub(camera.position).normalize()) < 0;
  });
}

renderer.domElement.addEventListener('pointerdown', e => {
  pointerDownPos = {x:e.clientX, y:e.clientY};
  isDragging = false;
});
renderer.domElement.addEventListener('pointermove', e => {
  const dx = e.clientX - pointerDownPos.x, dy = e.clientY - pointerDownPos.y;
  if (dx*dx + dy*dy > 25) isDragging = true;
  if (isMobile()) return; // skip hover on touch
  const hit = getHits(e.clientX, e.clientY)[0]?.object || null;
  if (hit !== hoveredMesh) {
    if (hoveredMesh && hoveredMesh !== selectedMesh) resetEmissive(hoveredMesh);
    hoveredMesh = hit;
    if (hoveredMesh && hoveredMesh !== selectedMesh) setEmissive(hoveredMesh, HOVER_COLOR, 0.45);
    renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  }
});

renderer.domElement.addEventListener('click', async e => {
  if (isDragging) return;
  const hits = getHits(e.clientX, e.clientY);
  if (!hits.length) {
    closePanel();
    if (selectedMesh) { resetEmissive(selectedMesh); selectedMesh=null; }
    return;
  }
  const mesh = hits[0].object;
  if (selectedMesh && selectedMesh !== mesh) resetEmissive(selectedMesh);
  selectedMesh = mesh;
  window._selectedMesh = mesh;
  setEmissive(mesh, SELECT_COLOR, 0.72);
  openPanel(mesh.name || mesh.uuid);
});

// ═══════════════════════════════════════════════════════════════
//  PART PANEL UI
// ═══════════════════════════════════════════════════════════════
const panelRoot = document.getElementById('part-panel-root');
let panelMeshName = null;

function closePanel() {
  panelRoot.innerHTML = '';
  panelMeshName = null;
}
window.closePanel = closePanel;

async function openPanel(meshName) {
  panelMeshName = meshName;
  showSkeleton(meshName);
  const map = await getPartsMap();
  const entry = map[meshName];
  if (meshName !== panelMeshName) return;
  if (entry?.bcItemNo) {
    showLoading(meshName, entry.bcItemNo);
    try {
      const part = await callGAS('getPartByItemNo', entry.bcItemNo);
      if (meshName !== panelMeshName) return;
      if (part?.no) { showPartInfo(meshName, {...part, category: entry.category||part.category}); return; }
    } catch {}
  }
  if (meshName !== panelMeshName) return;
  showSearch(meshName);
}

function stockColor(qty) {
  if (qty == null) return '#6b7280';
  return qty <= 0 ? '#ff0033' : qty <= 5 ? '#eab308' : '#00ff41';
}
function stockLabel(qty) {
  if (qty == null) return '—';
  return qty <= 0 ? 'Sin stock' : qty <= 5 ? 'Stock bajo' : 'En stock';
}
function stockRingSVG(qty) {
  const color = stockColor(qty);
  const r=20, cx=28, cy=28, sw=4, circ=2*Math.PI*r;
  const pct = qty > 0 ? Math.min(qty/Math.max(qty,50),1) : 0;
  const numLabel = qty==null ? '?' : qty>99 ? '99+' : String(qty);
  return `<svg width="56" height="56" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a1a1a" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${circ*pct} ${circ}" stroke-linecap="round"
      style="transition:stroke-dasharray .6s;filter:drop-shadow(0 0 4px ${color}88)"/>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle"
      fill="${color}" font-size="11" font-family="monospace" font-weight="bold"
      style="transform:rotate(90deg);transform-origin:${cx}px ${cy}px">${numLabel}</text>
  </svg>
  <span class="stock-label" style="color:${color}">${stockLabel(qty)}</span>`;
}

function closeBtnHTML() {
  return `<button class="close-btn" onclick="closePanel();if(window._selectedMesh){resetEmissive(window._selectedMesh);window._selectedMesh=null;selectedMesh=null;}" aria-label="Cerrar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>`;
}

function panelWrap(content) {
  return `<div class="part-panel">
    <div class="part-panel-inner">${content}</div>
  </div>`;
}

function showSkeleton(meshName) {
  panelRoot.innerHTML = panelWrap(`
    <div class="panel-handle"></div>
    <div class="panel-scroll">
      <div class="panel-pad">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div class="shimmer" style="height:10px;width:110px;border-radius:6px"></div>
          ${closeBtnHTML()}
        </div>
        <div class="shimmer" style="height:30px;width:160px;border-radius:8px;margin-bottom:12px"></div>
        <div class="shimmer" style="height:13px;width:100%;border-radius:6px;margin-bottom:6px"></div>
        <div class="shimmer" style="height:13px;width:70%;border-radius:6px;margin-bottom:20px"></div>
        <div style="display:flex;gap:8px">
          <div class="shimmer" style="height:24px;width:60px;border-radius:99px"></div>
          <div class="shimmer" style="height:24px;width:80px;border-radius:99px"></div>
        </div>
      </div>
      <div class="safe-bottom-pad"></div>
    </div>
  `);
}

function showLoading(meshName, itemNo) {
  panelRoot.innerHTML = panelWrap(`
    <div class="panel-handle"></div>
    <div class="panel-scroll">
      <div class="panel-pad">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:9px;font-family:monospace;color:#4b5563;text-transform:uppercase;letter-spacing:.1em">Cargando…</span>
          ${closeBtnHTML()}
        </div>
        <p class="panel-part-no" style="font-family:monospace;font-weight:700;color:#FFD700;text-shadow:0 0 20px #FFD70044;margin-bottom:12px">${itemNo}</p>
        <div style="display:flex;align-items:center;gap:10px;color:#6b7280;font-size:12px">
          <div style="width:14px;height:14px;border:2px solid #C9A84C;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0"></div>
          Consultando Business Central…
        </div>
      </div>
      <div class="safe-bottom-pad"></div>
    </div>
  `);
}

function showPartInfo(meshName, part) {
  const color = stockColor(part.inventory);
  const bcUrl = part.bcUrl || `${BC_BASE_URL}?page=30&filter=No. IS ${encodeURIComponent(part.no)}`;
  const chips = [part.category, part.unitOfMeasure].filter(Boolean)
    .map(c => `<span class="chip">${c}</span>`).join('');

  panelRoot.innerHTML = panelWrap(`
    <div class="panel-handle"></div>
    <div class="panel-scroll">
      <div class="panel-pad" style="border-bottom:1px solid ${color}15">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">
          <div style="min-width:0;padding-right:8px">
            <span style="font-size:9px;font-family:monospace;color:#4b5563;text-transform:uppercase;letter-spacing:.1em">Parte Identificada</span>
            <p class="panel-part-no" style="font-family:monospace;font-weight:700;color:#FFD700;margin-top:4px;line-height:1;text-shadow:0 0 20px #FFD70044;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${part.no}</p>
          </div>
          ${closeBtnHTML()}
        </div>
        <p style="font-size:14px;font-weight:600;color:#eee;margin-bottom:12px;line-height:1.45">${part.description||''}</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px">${chips}</div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0">
            ${stockRingSVG(part.inventory)}
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:0">
            <a href="${bcUrl}" target="_blank" class="action-btn action-btn-primary panel-btn" style="border-radius:12px">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Abrir en BC
            </a>
            <button onclick="openSearchPanel('${meshName.replace(/'/g,"\'")}')" class="action-btn action-btn-secondary panel-btn" style="border-radius:12px">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              Re-buscar
            </button>
          </div>
        </div>
        <p style="font-size:8px;font-family:monospace;color:#1e1e22;margin-top:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${meshName}</p>
      </div>
      <div class="safe-bottom-pad"></div>
    </div>
  `);
}

function openSearchPanel(meshName) {
  panelMeshName = meshName;
  showSearch(meshName);
}
window.openSearchPanel = openSearchPanel;

function showSearch(meshName) {
  panelRoot.innerHTML = panelWrap(`
    <div class="panel-handle"></div>
    <div class="panel-scroll">
      <div class="panel-pad" style="border-bottom:1px solid rgba(255,255,255,.04)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:9px;font-family:monospace;color:#4b5563;text-transform:uppercase;letter-spacing:.1em">Identificar Parte</span>
          ${closeBtnHTML()}
        </div>
        <p style="font-size:10px;font-family:monospace;color:#2d3748;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:14px">${meshName}</p>
        <div class="search-wrap" id="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" style="flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="search-input" class="search-input" placeholder="Nº parte o descripción…" autocomplete="off"
            inputmode="search" enterkeyhint="search"
            oninput="handleSearch(this.value,'${meshName.replace(/'/g,"\'")}')">
          <div id="search-spinner" style="display:none;width:14px;height:14px;border:2px solid #C9A84C;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0"></div>
        </div>
        <p id="search-error" style="font-size:10px;color:#ff0033;margin-top:8px;display:none"></p>
      </div>
      <div id="search-results" class="panel-search-results">
        <p style="font-size:11px;color:#374151;text-align:center;padding:18px 20px">Busca para identificar esta pieza</p>
      </div>
      <div class="safe-bottom-pad"></div>
    </div>
  `);
  setTimeout(() => document.getElementById('search-input')?.focus(), 80);
}

let _searchDebounce = null;
window.handleSearch = function(query, meshName) {
  clearTimeout(_searchDebounce);
  if (!query || query.length < 2) {
    document.getElementById('search-results').innerHTML = '<p style="font-size:11px;color:#374151;text-align:center;padding:16px 20px">Escribe al menos 2 caracteres</p>';
    return;
  }
  document.getElementById('search-spinner').style.display = '';
  _searchDebounce = setTimeout(async () => {
    try {
      const results = await callGAS('searchBcItems', query.trim());
      document.getElementById('search-spinner').style.display = 'none';
      const el = document.getElementById('search-results');
      if (!el) return;
      if (!results?.length) {
        el.innerHTML = '<p style="font-size:11px;color:#4b5563;text-align:center;padding:16px 20px">Sin resultados en Business Central</p>';
        return;
      }
      el.innerHTML = results.map(item => `
        <button class="tag-row-btn" onclick="tagPart('${meshName.replace(/'/g,"\'")}','${item.no.replace(/'/g,"\'")}','${(item.description||'').replace(/'/g,"\'").replace(/"/g,"&quot;")}','${(item.category||'').replace(/'/g,"\'")}')">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
            <div style="min-width:0">
              <p style="font-size:13px;font-family:monospace;color:#C9A84C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.no}</p>
              <p style="font-size:11px;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px">${item.description||''}</p>
            </div>
            <span style="font-size:9px;font-family:monospace;color:#374151;flex-shrink:0;padding-top:3px">Tag →</span>
          </div>
          ${item.category ? `<span class="chip" style="margin-top:6px;display:inline-block">${item.category}</span>` : ''}
        </button>
      `).join('');
    } catch {
      document.getElementById('search-spinner').style.display = 'none';
      const errEl = document.getElementById('search-error');
      if (errEl) { errEl.style.display=''; errEl.textContent='Error al buscar en BC'; }
    }
  }, 380);
};

window.tagPart = async function(meshName, bcItemNo, description, category) {
  try {
    await callGAS('tagMeshAsPart', meshName, bcItemNo, category);
    if (_partsMap) _partsMap[meshName] = { bcItemNo, category };
    updateTaggedCounter();
    showPartInfo(meshName, { no:bcItemNo, description, category, inventory:null });
    callGAS('getPartByItemNo', bcItemNo).then(full => {
      if (full?.no && panelMeshName === meshName) showPartInfo(meshName, {...full, category: category||full.category});
    }).catch(()=>{});
  } catch(e) { console.error('tagPart error:', e); }
};

// ═══════════════════════════════════════════════════════════════
//  RENDER LOOP + RESIZE
// ═══════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  const counter = document.getElementById('tagged-label');
  if (counter) counter.textContent = window.innerWidth < 360 ? '' : 'catalogadas';
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  composer.render();
})();
</script>
</body>
</html>
