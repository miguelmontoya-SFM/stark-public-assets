<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stark Future | 3D Parts Identifier</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/branding/Stark%20Future%20Ring%20RGB.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'stark-green':'#00ff41','stark-red':'#ff0033','stark-gold':'#C9A84C' } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/environments/RoomEnvironment.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    @font-face { font-family:'StarkSans'; src:url('https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/fonts/2_StarkSans-Regular.otf') format('opentype'); font-weight:400; font-display:swap; }
    @font-face { font-family:'StarkSans'; src:url('https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/fonts/3_StarkSans-Medium.otf') format('opentype'); font-weight:500; font-display:swap; }
    @font-face { font-family:'StarkSans'; src:url('https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/fonts/5_StarkSans-Bold.otf') format('opentype'); font-weight:700; font-display:swap; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#080809; --card:#0e0e10; --border:#1a1a1f;
      --gold:#C9A84C; --gold-bright:#FFD700; --green:#00ff41; --red:#ff0033;
      --text:#eeeeee; --muted:#6b7280;
    }
    html,body { background:var(--bg); color:var(--text); font-family:'StarkSans','Inter',system-ui,sans-serif; height:100%; overflow:hidden; }
    #canvas-wrap { position:relative; width:100vw; height:100vh; }
    canvas { display:block; width:100%!important; height:100%!important; }
    @keyframes slideInRight { from{opacity:0;transform:translateX(14px)} to{opacity:1;transform:translateX(0)} }
    @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
    .shimmer { background:linear-gradient(90deg,#1a1a1a 25%,#262626 50%,#1a1a1a 75%); background-size:400px 100%; animation:shimmer 1.4s infinite; }
    @keyframes starkFadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    /* Loader overlay */
    #loader { position:fixed; inset:0; background:#080809; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; transition:opacity .6s; }
    #loader.fade-out { opacity:0; pointer-events:none; }
    #loader-bar-track { width:280px; height:2px; background:#1a1a1a; border-radius:9px; margin-top:24px; }
    #loader-bar { height:100%; background:linear-gradient(90deg,#C9A84C,#FFD700); border-radius:9px; transition:width .2s; width:0%; box-shadow:0 0 12px #C9A84C88; }
    /* Header */
    #header { position:fixed; top:0; left:0; right:0; z-index:20; padding:16px 20px; display:flex; align-items:center; gap:12px; pointer-events:none; }
    .header-badge { background:rgba(8,8,9,.85); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:8px 14px; }
    /* Help pill */
    #help-pill { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:20;
      background:rgba(8,8,9,.8); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.06);
      border-radius:99px; padding:8px 18px; font-size:11px; color:var(--muted); font-family:monospace;
      pointer-events:none; transition:opacity .4s; }
    #help-pill.hidden { opacity:0; }
    /* Part panel base */
    .part-panel { position:fixed; bottom:20px; right:20px; z-index:30; animation:slideInRight .22s cubic-bezier(.4,0,.2,1); }
  </style>
</head>
<body>

<!-- ── LOADER ─────────────────────────────────────────────────────────── -->
<div id="loader">
  <img src="https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/branding/Stark%20Future%20Ring%20RGB.png"
       width="52" height="52" alt="Stark" style="filter:drop-shadow(0 0 20px #C9A84C66)">
  <p style="margin-top:20px;font-size:13px;color:#6b7280;font-family:monospace;letter-spacing:.12em">CARGANDO MODELO 3D</p>
  <div id="loader-bar-track"><div id="loader-bar"></div></div>
  <p id="loader-pct" style="margin-top:10px;font-size:11px;color:#444;font-family:monospace">0%</p>
</div>

<!-- ── HEADER ─────────────────────────────────────────────────────────── -->
<div id="header">
  <div class="header-badge" style="display:flex;align-items:center;gap:10px">
    <img src="https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/branding/Stark%20Future%20Ring%20RGB.png"
         width="22" height="22" alt="Stark">
    <span style="font-size:12px;font-weight:500;color:#eee;letter-spacing:.04em">3D Parts Identifier</span>
  </div>
  <div class="header-badge" id="tagged-counter" style="display:none">
    <span style="font-size:11px;font-family:monospace;color:#C9A84C">
      <span id="tagged-num">0</span> partes catalogadas
    </span>
  </div>
</div>

<!-- ── CANVAS ─────────────────────────────────────────────────────────── -->
<div id="canvas-wrap">
  <canvas id="three-canvas"></canvas>
</div>

<!-- ── HELP PILL ──────────────────────────────────────────────────────── -->
<div id="help-pill">Click en cualquier parte para identificarla</div>

<!-- ── PART PANEL (rendered by JS) ───────────────────────────────────── -->
<div id="part-panel-root"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const GLB_URL       = 'https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/moto_web.glb';
const DRACO_PATH    = 'https://www.gstatic.com/draco/versioned/decoders/1.5.6/';
const PARTS_MAP_URL = 'https://raw.githubusercontent.com/miguelmontoya-SFM/stark-public-assets/main/parts-mesh-map.json';
const BC_BASE_URL   = 'https://businesscentral.dynamics.com';

// ═══════════════════════════════════════════════════════════════
//  PARTS MAP CACHE
// ═══════════════════════════════════════════════════════════════
let _partsMap = null;
async function getPartsMap() {
  if (_partsMap) return _partsMap;
  try {
    const r = await fetch(PARTS_MAP_URL + '?t=' + Math.floor(Date.now()/300000));
    _partsMap = await r.json();
  } catch { _partsMap = {}; }
  return _partsMap;
}

// ═══════════════════════════════════════════════════════════════
//  google.script.run PROMISE WRAPPER
// ═══════════════════════════════════════════════════════════════
function callGAS(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google?.script?.run) { reject(new Error('No GAS context')); return; }
    window.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

// ═══════════════════════════════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════════════════════════════
const canvas   = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080809);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 1000);
camera.position.set(0, 0.8, 2.8);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.5;
controls.maxDistance = 8;

// Environment
const pmremGen = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGen.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

// Bloom post-processing
const composer  = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.6, 0.82
);
composer.addPass(bloomPass);

// ═══════════════════════════════════════════════════════════════
//  MESH STATE
// ═══════════════════════════════════════════════════════════════
let allMeshes = [];
let hoveredMesh = null, selectedMesh = null;
const origEmissive = new Map(); // mesh → original emissive hex

const HOVER_COLOR  = new THREE.Color(0xFFCC44);
const SELECT_COLOR = new THREE.Color(0xFFD700);
const DIM_COLOR    = new THREE.Color(0x888888);

function setEmissive(mesh, color, intensity) {
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  mats.forEach(mat => {
    if (mat.emissive !== undefined) {
      mat.emissive.copy(color);
      mat.emissiveIntensity = intensity;
    }
  });
}
function resetEmissive(mesh) {
  const orig = origEmissive.get(mesh);
  if (!orig) return;
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  mats.forEach(mat => {
    if (mat.emissive !== undefined) {
      mat.emissive.copy(orig.color);
      mat.emissiveIntensity = orig.intensity;
    }
  });
}
function storeOrigEmissive(mesh) {
  if (origEmissive.has(mesh)) return;
  const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
  origEmissive.set(mesh, {
    color: mat?.emissive ? mat.emissive.clone() : new THREE.Color(0),
    intensity: mat?.emissiveIntensity ?? 0
  });
}

// ═══════════════════════════════════════════════════════════════
//  LOAD GLB
// ═══════════════════════════════════════════════════════════════
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath(DRACO_PATH);
const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

const loaderBar = document.getElementById('loader-bar');
const loaderPct = document.getElementById('loader-pct');
const loaderEl  = document.getElementById('loader');

gltfLoader.load(
  GLB_URL,
  (gltf) => {
    // Center model
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    gltf.scene.position.sub(center);
    const size = box.getSize(new THREE.Vector3()).length();
    camera.position.set(0, size*0.25, size*0.9);
    controls.target.set(0, 0, 0);
    controls.update();

    gltf.scene.traverse(child => {
      if (!child.isMesh) return;
      storeOrigEmissive(child);
      child.castShadow = true;
      allMeshes.push(child);
    });

    scene.add(gltf.scene);

    // Fade out loader
    loaderEl.classList.add('fade-out');
    setTimeout(() => { loaderEl.style.display='none'; }, 600);

    // Update tagged counter
    updateTaggedCounter();
    
    // Dim help pill after 4s
    setTimeout(() => document.getElementById('help-pill').classList.add('hidden'), 4000);
  },
  (xhr) => {
    const pct = Math.round((xhr.loaded / xhr.total) * 100);
    loaderBar.style.width = pct + '%';
    loaderPct.textContent = pct + '%';
  },
  (err) => {
    loaderPct.textContent = 'Error al cargar modelo';
    console.error('GLB load error:', err);
  }
);

// ═══════════════════════════════════════════════════════════════
//  TAGGED COUNTER
// ═══════════════════════════════════════════════════════════════
async function updateTaggedCounter() {
  const map = await getPartsMap();
  const count = Object.values(map).filter(v => v.bcItemNo).length;
  const el = document.getElementById('tagged-counter');
  if (count > 0) {
    el.style.display = '';
    document.getElementById('tagged-num').textContent = count;
  }
}

// ═══════════════════════════════════════════════════════════════
//  RAYCASTER + CLICK HANDLING
// ═══════════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();
let isDragging  = false, pointerDownPos = {x:0,y:0};

renderer.domElement.addEventListener('pointerdown', e => {
  pointerDownPos = {x:e.clientX, y:e.clientY};
  isDragging = false;
});
renderer.domElement.addEventListener('pointermove', e => {
  const dx = e.clientX - pointerDownPos.x, dy = e.clientY - pointerDownPos.y;
  if (Math.sqrt(dx*dx+dy*dy) > 5) isDragging = true;

  // Hover detection (throttled)
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(allMeshes, false).filter(h => {
    if (!h.face) return true;
    const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    return n.dot(h.point.clone().sub(camera.position).normalize()) < 0;
  });
  const hit = hits[0]?.object || null;
  if (hit !== hoveredMesh) {
    if (hoveredMesh && hoveredMesh !== selectedMesh) resetEmissive(hoveredMesh);
    hoveredMesh = hit;
    if (hoveredMesh && hoveredMesh !== selectedMesh) setEmissive(hoveredMesh, HOVER_COLOR, 0.45);
    renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  }
});

renderer.domElement.addEventListener('click', async (e) => {
  if (isDragging) return;
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(allMeshes, false).filter(h => {
    if (!h.face) return true;
    const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    return n.dot(h.point.clone().sub(camera.position).normalize()) < 0;
  });

  if (!hits.length) {
    closePanel();
    if (selectedMesh) { resetEmissive(selectedMesh); selectedMesh=null; }
    return;
  }

  const mesh = hits[0].object;
  if (selectedMesh && selectedMesh !== mesh) resetEmissive(selectedMesh);
  selectedMesh = mesh;
  setEmissive(mesh, SELECT_COLOR, 0.72);
  openPanel(mesh.name || mesh.uuid);
});

// ═══════════════════════════════════════════════════════════════
//  PART PANEL UI (vanilla JS — no React dependency)
// ═══════════════════════════════════════════════════════════════
const panelRoot = document.getElementById('part-panel-root');
let panelMeshName = null;

function closePanel() {
  panelRoot.innerHTML = '';
  panelMeshName = null;
}

async function openPanel(meshName) {
  panelMeshName = meshName;
  showSkeleton(meshName);

  const map   = await getPartsMap();
  const entry = map[meshName];

  if (meshName !== panelMeshName) return; // stale

  if (entry?.bcItemNo) {
    showLoading(meshName, entry.bcItemNo);
    try {
      const part = await callGAS('getPartByItemNo', entry.bcItemNo);
      if (meshName !== panelMeshName) return;
      if (part?.no) { showPartInfo(meshName, { ...part, category: entry.category || part.category }); return; }
    } catch { /* fallthrough to search */ }
  }
  if (meshName !== panelMeshName) return;
  showSearch(meshName);
}

function stockColor(qty) {
  if (qty === null || qty === undefined) return '#6b7280';
  return qty <= 0 ? '#ff0033' : qty <= 5 ? '#eab308' : '#00ff41';
}
function stockLabel(qty) {
  if (qty === null || qty === undefined) return '—';
  return qty <= 0 ? 'Sin stock' : qty <= 5 ? 'Stock bajo' : 'En stock';
}
function stockRingSVG(qty) {
  const color = stockColor(qty);
  const r=20,cx=28,cy=28,sw=4, circ=2*Math.PI*r;
  const pct = qty > 0 ? Math.min(qty/Math.max(qty,50),1) : 0;
  const numLabel = qty===null?'?':qty>99?'99+':String(qty);
  return `<svg width="56" height="56" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a1a1a" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${circ*pct} ${circ}" stroke-linecap="round"
      style="transition:stroke-dasharray .6s;filter:drop-shadow(0 0 4px ${color}88)"/>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle"
      fill="${color}" font-size="11" font-family="monospace" font-weight="bold"
      style="transform:rotate(90deg);transform-origin:${cx}px ${cy}px">${numLabel}</text>
  </svg>
  <span style="font-size:9px;font-family:monospace;text-transform:uppercase;letter-spacing:.1em;color:${color}">${stockLabel(qty)}</span>`;
}

function panelWrap(content, extraStyle='') {
  return `<div class="part-panel" style="width:288px;background:rgba(8,8,9,.96);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.8)${extraStyle && ';'+extraStyle}">${content}</div>`;
}
function closeBtn() {
  return `<button onclick="closePanel();if(window._selectedMesh){resetEmissive(window._selectedMesh);window._selectedMesh=null;}" style="background:none;border:none;color:#4b5563;cursor:pointer;padding:2px;line-height:0;flex-shrink:0" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#4b5563'">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>`;
}

function showSkeleton(meshName) {
  panelRoot.innerHTML = panelWrap(`
    <div style="padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="shimmer" style="height:10px;width:120px;border-radius:6px"></div>
        ${closeBtn()}
      </div>
      <div class="shimmer" style="height:28px;width:160px;border-radius:8px;margin-bottom:10px"></div>
      <div class="shimmer" style="height:13px;width:100%;border-radius:6px;margin-bottom:6px"></div>
      <div class="shimmer" style="height:13px;width:75%;border-radius:6px;margin-bottom:18px"></div>
      <div style="display:flex;gap:8px">
        <div class="shimmer" style="height:24px;width:64px;border-radius:99px"></div>
        <div class="shimmer" style="height:24px;width:80px;border-radius:99px"></div>
      </div>
    </div>
  `);
}

function showLoading(meshName, itemNo) {
  panelRoot.innerHTML = panelWrap(`
    <div style="padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:9px;font-family:monospace;color:#4b5563;text-transform:uppercase;letter-spacing:.1em">Cargando...</span>
        ${closeBtn()}
      </div>
      <p style="font-size:28px;font-family:monospace;font-weight:700;color:#FFD700;margin-bottom:8px;text-shadow:0 0 20px #FFD70044">${itemNo}</p>
      <div style="display:flex;align-items:center;gap:8px;color:#6b7280;font-size:11px">
        <div style="width:14px;height:14px;border:2px solid #C9A84C;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></div>
        Consultando Business Central…
      </div>
    </div>
  `);
}

function showPartInfo(meshName, part) {
  const color = stockColor(part.inventory);
  const bcUrl = part.bcUrl || `${BC_BASE_URL}?page=30&filter=No. IS ${encodeURIComponent(part.no)}`;
  const chips = [part.category, part.unitOfMeasure].filter(Boolean)
    .map(c => `<span style="font-size:9px;font-family:monospace;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;background:#111113;border:1px solid #1e1e22;border-radius:99px;padding:3px 10px">${c}</span>`).join('');

  panelRoot.innerHTML = panelWrap(`
    <div style="padding:16px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
        <div style="min-width:0">
          <span style="font-size:9px;font-family:monospace;color:#4b5563;text-transform:uppercase;letter-spacing:.1em">Parte Identificada</span>
          <p style="font-size:30px;font-family:monospace;font-weight:700;color:#FFD700;margin-top:3px;line-height:1;text-shadow:0 0 20px #FFD70044;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${part.no}</p>
        </div>
        ${closeBtn()}
      </div>
      <p style="font-size:13px;font-weight:600;color:#eee;margin-bottom:12px;line-height:1.4">${part.description || ''}</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${chips}</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          ${stockRingSVG(part.inventory)}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <a href="${bcUrl}" target="_blank" style="display:flex;align-items:center;gap:6px;font-size:10px;font-family:monospace;color:#C9A84C;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:7px 14px;text-decoration:none;transition:all .2s" onmouseover="this.style.color='#FFD700';this.style.background='rgba(201,168,76,.2)'" onmouseout="this.style.color='#C9A84C';this.style.background='rgba(201,168,76,.1)'">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Abrir en BC
          </a>
          <button onclick="openSearchPanel('${meshName.replace(/'/g,"\\'")}')" style="display:flex;align-items:center;gap:6px;font-size:10px;font-family:monospace;color:#6b7280;background:#111113;border:1px solid #1e1e22;border-radius:10px;padding:7px 14px;cursor:pointer;transition:all .2s" onmouseover="this.style.color='#aaa';this.style.background='#1a1a1e'" onmouseout="this.style.color='#6b7280';this.style.background='#111113'">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Re-buscar
          </button>
        </div>
      </div>
      <p style="font-size:8px;font-family:monospace;color:#1e1e22;margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${meshName}</p>
    </div>
  `, `border-color:${color}22`);
}

function openSearchPanel(meshName) {
  panelMeshName = meshName;
  showSearch(meshName);
}
window.openSearchPanel = openSearchPanel;

function showSearch(meshName) {
  panelRoot.innerHTML = panelWrap(`
    <div style="padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.04)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:9px;font-family:monospace;color:#4b5563;text-transform:uppercase;letter-spacing:.1em">Identificar Parte</span>
        ${closeBtn()}
      </div>
      <p style="font-size:10px;font-family:monospace;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${meshName}</p>
    </div>
    <div style="padding:12px 16px 10px">
      <div id="search-wrap" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid #1e1e22;border-radius:12px;padding:9px 12px;transition:border-color .2s">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" style="flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-input" placeholder="Nº parte o descripción…" autocomplete="off"
          style="background:none;border:none;outline:none;color:#eee;font-size:12px;width:100%;font-family:monospace"
          oninput="handleSearch(this.value,'${meshName.replace(/'/g,"\\'")}')"
          onfocus="document.getElementById('search-wrap').style.borderColor='rgba(201,168,76,.5)'"
          onblur="document.getElementById('search-wrap').style.borderColor='#1e1e22'">
        <div id="search-spinner" style="display:none;width:12px;height:12px;border:2px solid #C9A84C;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0"></div>
      </div>
      <p id="search-error" style="font-size:10px;color:#ff0033;margin-top:6px;display:none"></p>
    </div>
    <div id="search-results" style="max-height:200px;overflow-y:auto;border-top:1px solid rgba(255,255,255,.03);scrollbar-width:thin;scrollbar-color:#222 transparent">
      <p style="font-size:10px;color:#374151;text-align:center;padding:14px 16px">Busca para identificar esta pieza</p>
    </div>
  `);
  setTimeout(() => document.getElementById('search-input')?.focus(), 60);
}

let _searchDebounce = null;
window.handleSearch = function(query, meshName) {
  clearTimeout(_searchDebounce);
  if (!query || query.length < 2) {
    document.getElementById('search-results').innerHTML = '<p style="font-size:10px;color:#374151;text-align:center;padding:14px 16px">Escribe al menos 2 caracteres</p>';
    return;
  }
  document.getElementById('search-spinner').style.display = '';
  _searchDebounce = setTimeout(async () => {
    try {
      const results = await callGAS('searchBcItems', query.trim());
      document.getElementById('search-spinner').style.display = 'none';
      const el = document.getElementById('search-results');
      if (!el) return;
      if (!results?.length) {
        el.innerHTML = '<p style="font-size:10px;color:#4b5563;text-align:center;padding:14px 16px">Sin resultados en Business Central</p>';
        return;
      }
      el.innerHTML = results.map(item => `
        <button onclick="tagPart('${meshName.replace(/'/g,"\\'")}','${item.no.replace(/'/g,"\\'")}','${(item.description||'').replace(/'/g,"\\'").replace(/"/g,"&quot;")}','${(item.category||'').replace(/'/g,"\\'")}')"
          style="width:100%;text-align:left;padding:10px 16px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:background .15s"
          onmouseover="this.style.background='rgba(255,255,255,.03)'" onmouseout="this.style.background='none'">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
            <div style="min-width:0">
              <p style="font-size:11px;font-family:monospace;color:#C9A84C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.no}</p>
              <p style="font-size:10px;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">${item.description||''}</p>
            </div>
            <span style="font-size:9px;font-family:monospace;color:#374151;flex-shrink:0;margin-top:2px">Tag →</span>
          </div>
          ${item.category ? `<span style="display:inline-block;margin-top:5px;font-size:8px;font-family:monospace;text-transform:uppercase;letter-spacing:.08em;color:#374151;background:#111113;border-radius:99px;padding:2px 8px">${item.category}</span>` : ''}
        </button>
      `).join('');
    } catch(e) {
      document.getElementById('search-spinner').style.display = 'none';
      const errEl = document.getElementById('search-error');
      if (errEl) { errEl.style.display=''; errEl.textContent='Error al buscar en BC'; }
    }
  }, 380);
};

window.tagPart = async function(meshName, bcItemNo, description, category) {
  try {
    await callGAS('tagMeshAsPart', meshName, bcItemNo, category);
    if (_partsMap) _partsMap[meshName] = { bcItemNo, category };
    updateTaggedCounter();
    showPartInfo(meshName, { no:bcItemNo, description, category, inventory:null });
    // Fetch full info in background
    callGAS('getPartByItemNo', bcItemNo).then(full => {
      if (full?.no && panelMeshName === meshName) showPartInfo(meshName, { ...full, category: category||full.category });
    }).catch(()=>{});
  } catch(e) {
    console.error('tagPart error:', e);
  }
};

// ═══════════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  composer.render();
})();
</script>
<style>
@keyframes spin { to { transform:rotate(360deg) } }
</style>
</body>
</html>
